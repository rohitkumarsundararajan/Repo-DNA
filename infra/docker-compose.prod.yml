# infra/docker-compose.prod.yml
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    ports: !reset []              # never publish 5432
    mem_limit: 1g

  redis:
    ports: !reset []              # never publish 6379
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    mem_limit: 256m

  api-service:
    ports: !reset []              # Caddy reaches it on the internal network
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in infra/.env}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    mem_limit: 1g

  analysis-worker:
    mem_limit: 1536m

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-service
    mem_limit: 128m

volumes:
  redisdata:
  caddy_data:
  caddy_config:
